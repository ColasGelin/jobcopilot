[project]
name = "jobcopilot"
version = "0.1.0"
description = "Local job-search copilot: collects, filters, scores and drafts applications with an LLM."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "python-multipart>=0.0.33",
    "pyyaml",
    "typer",
    "uvicorn>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
jobcopilot = "jobcopilot.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.47",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobcopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
