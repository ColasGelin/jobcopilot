[project]
name = "jobcopilot"
version = "0.1.0"
description = "Local job-search copilot: collects, filters, scores and drafts applications with an LLM."
requires-python = ">=3.11"
dependencies = ["httpx", "pydantic>=2", "pyyaml", "typer"]

[project.scripts]
jobcopilot = "jobcopilot.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobcopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
