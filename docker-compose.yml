# Usage on the server:
#   cp .env.example .env   # add CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`
#   docker compose up -d --build
# Dashboard: published on 127.0.0.1:8077 only; reach it via `LocalForward 8077 localhost:8077` in ~/.ssh/config.
services:
  jobcopilot:
    build: .
    image: jobcopilot:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
    env_file: .env          # CLAUDE_CODE_OAUTH_TOKEN=... (git-ignored)
    volumes:
      - ./data:/data        # profile.yaml, config.yaml, cv.yaml, jobs.db, cvs/, reports/, logs/
    command: ["daemon", "--at", "08:30"]

  web:
    image: jobcopilot:latest
    depends_on: [jobcopilot]
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
    env_file: .env          # the dashboard calls Claude when you click "Tailor CV"; it has no login, so keep the port local-only
    volumes:
      - ./data:/data
    command: ["serve", "--host", "0.0.0.0", "--port", "8077"]   # 0.0.0.0 inside the container only
    ports:
      - "127.0.0.1:8077:8077"
